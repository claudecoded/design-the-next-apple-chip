<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design the Next Apple Chip</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #0b0b0c;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .grid-bg {
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .chip-socket {
            background: radial-gradient(circle at center, #1c1c1e 0%, #0b0b0c 100%);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="grid-bg min-h-screen flex flex-col justify-between">
    <div id="root" class="w-full flex flex-col min-h-screen"></div>

    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>

    <script type="text/babel" src="src/components/ChipCanvas.js"></script>
    <script type="text/babel" src="src/components/Sidebar.js"></script>
    <script type="text/babel" src="src/components/Header.js"></script>
    <script type="text/babel" src="src/App.js"></script>
</body>
</html>
